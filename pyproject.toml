[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flychess"
version = "0.1.0"
description = "A simulated fruit fly brain (FlyWire v783 connectome) that plays chess"
requires-python = ">=3.11"
dependencies = ["torch", "numpy", "scipy", "pandas", "pyarrow", "chess", "tqdm"]

[tool.setuptools]
packages = ["flychess"]
